plugins { id 'com.android.application' }

android {
    namespace 'net.bonjiminium.phonemic'
    compileSdk 36
    defaultConfig {
        applicationId 'net.bonjiminium.phonemic.spike'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '0.3.0-guided-setup'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(Test).configureEach {
    def config = providers.environmentVariable('PHONE_MIC_RECEIVER_TEST_CONFIG')
    inputs.property('receiverIntegration', config.orElse('disabled'))
    if (config.isPresent()) inputs.file(config.get())
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3.0 uses these classes but omits AndroidX Core from its POM.
    implementation 'androidx.core:core:1.17.0'
    // IntentIntegrator exposes FragmentActivity overloads; result-path tests load them.
    implementation 'androidx.fragment:fragment:1.8.9'
    testImplementation 'org.json:json:20250517'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
